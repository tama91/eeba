<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — EEBA 2027</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{ --ink:#0B0E13; --muted:#767E8B; --line:#E2E7EC; --accent:#0057D9; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased;
  }
  .box{ max-width:460px; text-align:center; }
  svg.mark{ width:44px; margin:0 auto 28px; }
  .code{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); margin-bottom:18px;
  }
  h1{ font-size:38px; font-weight:600; letter-spacing:-.03em; line-height:1.1; margin:0 0 16px; }
  h1 em{ font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-weight:400; color:var(--accent); }
  p{ color:var(--muted); font-size:15.5px; line-height:1.6; margin:0 0 28px; }
  a.btn{
    display:inline-flex; align-items:center; gap:9px; padding:13px 26px; border-radius:100px;
    background:var(--accent); color:#fff; text-decoration:none; font-size:15px; font-weight:500;
  }
  a.btn:hover{ background:#0043A8; }
  .path{
    margin-top:34px; padding-top:22px; border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); word-break:break-all;
  }
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14.5" fill="none" stroke="#0B0E13" stroke-width="1.2" opacity=".22"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="#0057D9" stroke-width="1.4"/>
      <circle cx="16" cy="16" r="4.6" fill="#0057D9"/>
    </svg>
    <div class="code" id="code">Error 404</div>
    <h1 id="title">This page is <em>not here</em>.</h1>
    <p id="body">The address may be mistyped, or the page may have moved since it was linked.</p>
    <a class="btn" href="/" id="back">Back to EEBA 2027 →</a>
    <div class="path" id="path"></div>
  </div>
  <script>
  /* Pagina statica servita da Cloudflare: le traduzioni stanno qui, non
     nel database, perché deve funzionare anche se l'API è irraggiungibile. */
  var L = {
    en: { code:"Error 404", t:"This page is <em>not here</em>.",
          b:"The address may be mistyped, or the page may have moved since it was linked.",
          back:"Back to EEBA 2027 →" },
    it: { code:"Errore 404", t:"Questa pagina <em>non c'è</em>.",
          b:"L'indirizzo potrebbe essere scritto male, oppure la pagina è stata spostata.",
          back:"Torna a EEBA 2027 →" },
    nl: { code:"Fout 404", t:"Deze pagina <em>bestaat niet</em>.",
          b:"Het adres klopt mogelijk niet, of de pagina is verplaatst sinds de link is gemaakt.",
          back:"Terug naar EEBA 2027 →" },
    fr: { code:"Erreur 404", t:"Cette page <em>n'existe pas</em>.",
          b:"L'adresse est peut-être mal saisie, ou la page a été déplacée depuis.",
          back:"Retour à EEBA 2027 →" }
  };
  var code = "en";
  try { code = localStorage.getItem("eeba27.lang") || (navigator.language || "en").slice(0,2).toLowerCase(); } catch(e){}
  var t = L[code] || L.en;
  document.documentElement.lang = L[code] ? code : "en";
  document.getElementById("code").textContent = t.code;
  document.getElementById("title").innerHTML = t.t;
  document.getElementById("body").textContent = t.b;
  document.getElementById("back").textContent = t.back;
  document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
