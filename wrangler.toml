# Worker con asset statici (non un progetto Pages).
# Deploy:  npx wrangler deploy

name = "eeba"
main = "src/index.js"
compatibility_date = "2026-08-04"

# Il sito statico. run_worker_first garantisce che /api/* arrivi sempre al
# Worker e non venga intercettato dal router degli asset.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Database D1
[[d1_databases]]
binding = "DB"
database_name = "eeba-2027"
database_id = "4111ef08-0360-4af4-9953-cedb4dd05e89"
