name = "eeba"
compatibility_date = "2026-08-04"

# Il sito statico sta in public/. La cartella functions/ resta alla radice:
# Cloudflare Pages la riconosce da sé e non la pubblica come file statici.
pages_build_output_dir = "public"

# Database D1. Sostituisci database_id con quello che ti restituisce
#   npx wrangler d1 create eeba-2027
[[d1_databases]]
binding = "DB"
database_name = "eeba-2027"
database_id = "4111ef08-0360-4af4-9953-cedb4dd05e89"
